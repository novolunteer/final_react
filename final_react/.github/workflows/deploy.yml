name: Deploy React to EC2

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v1

      - name: Docker 이미지 빌드 & ECR push
        run: |
          docker build \
            --build-arg VITE_SPRING_API_BASE_URL=${{ secrets.VITE_SPRING_API_BASE_URL }} \
            --build-arg VITE_CHATBOT_API_BASE_URL=${{ secrets.VITE_CHATBOT_API_BASE_URL }} \
            --build-arg VITE_TOSS_API_CLIENT_KEY=${{ secrets.VITE_TOSS_API_CLIENT_KEY }} \
            --build-arg VITE_NAVER_LOGIN_API_URL=${{ secrets.VITE_NAVER_LOGIN_API_URL }} \
            --build-arg VITE_KAKAO_REDIRECT_URI=${{ secrets.VITE_KAKAO_REDIRECT_URI }} \
            --build-arg VITE_KAKAO_CLIENT_ID=${{ secrets.VITE_KAKAO_CLIENT_ID }} \
            -t 143555787778.dkr.ecr.ap-northeast-2.amazonaws.com/my-project-nginx:latest .
          docker push 143555787778.dkr.ecr.ap-northeast-2.amazonaws.com/my-project-nginx:latest

      - name: EC2에서 새 이미지로 컨테이너 재시작
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 143555787778.dkr.ecr.ap-northeast-2.amazonaws.com
            docker pull 143555787778.dkr.ecr.ap-northeast-2.amazonaws.com/my-project-nginx:latest
            docker stop nginx
            docker rm nginx
            docker run -d \
              --name nginx \
              -p 80:80 \
              -p 443:443 \
              -v /home/ubuntu/nginx.conf:/etc/nginx/nginx.conf \
              -v /home/ubuntu/default.conf:/etc/nginx/conf.d/default.conf \
              -v /home/ubuntu/fullchain.crt:/etc/ssl/mycert/fullchain.crt \
              -v /home/ubuntu/private.key:/etc/ssl/mycert/private.key \
              143555787778.dkr.ecr.ap-northeast-2.amazonaws.com/my-project-nginx:latest